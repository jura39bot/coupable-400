# XcodeGen — génère le projet Xcode depuis cette description.
#   brew install xcodegen && cd ios && xcodegen generate
name: Coupable400
options:
  bundleIdPrefix: com.jura39bot
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  Coupable400:
    type: application
    platform: iOS
    sources:
      - path: Coupable400
    info:
      path: Coupable400/Info.plist
      properties:
        CFBundleDisplayName: Coupable 400
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jura39bot.coupable400
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
